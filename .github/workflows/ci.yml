name: CI

on:
  push:
    branches: [ main, ios_support ]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Publish dry-run
        run: flutter pub publish --dry-run
      - name: pana score
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 20 .

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build example APK (compiles Kotlin + native C)
        run: |
          cd example
          flutter pub get
          flutter build apk --debug

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build example iOS (compiles Swift + native C)
        run: |
          cd example
          flutter pub get
          flutter build ios --no-codesign --debug
      - name: Lint podspec
        run: |
          cd ios
          pod lib lint --allow-warnings || true
