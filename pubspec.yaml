name: flutter_native_vision_camera
description: "High-performance Flutter FFI camera plugin with zero-copy preview and real-time frame processing."
version: 0.0.3
homepage: https://github.com/JenteJan/flutter_native_vision_camera
repository: https://github.com/JenteJan/flutter_native_vision_camera

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
flutter:
  plugin:
    platforms:
      android:
        package: dev.jentejan.flutter_native_vision_camera
        pluginClass: FlutterNativeVisionCameraPlugin
        ffiPlugin: true
      ios:
        pluginClass: FlutterNativeVisionCameraPlugin
        ffiPlugin: true